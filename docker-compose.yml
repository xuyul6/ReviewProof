name: reviewproof

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reviewproof
      POSTGRES_PASSWORD: reviewproof
      POSTGRES_DB: reviewproof
    ports:
      - "54329:5432"
    volumes:
      - reviewproof-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reviewproof-pgdata:
