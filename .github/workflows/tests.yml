name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: reviewproof
          POSTGRES_PASSWORD: reviewproof
          POSTGRES_DB: reviewproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tests never load a model; the CPU build of torch avoids the multi-GB CUDA download
      # that exhausted the runner's disk and timed out.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          REVIEWPROOF_TEST_DATABASE_URL: postgresql://reviewproof:reviewproof@localhost:5432/reviewproof_test
        run: python -m unittest discover -s tests -v
